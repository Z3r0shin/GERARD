; GERARD firmware, hardware revision A (RP2040-Zero).
; Every version below is pinned. Do not update them without recording the new version.

[env:gerard]
; maxgerhardt/platform-raspberrypi, the PlatformIO platform that arduino-pico documents, pinned to one commit.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 64k
lib_deps =
    olikraus/U8g2@2.36.18
extra_scripts = pre:tools/version.py
build_flags =
    -Wall
    -Wextra
monitor_speed = 115200
